<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm2Future - Water Usage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>💧 Water Usage Tracker</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="chatbot.html">Chatbot</a>
      <a href="market.html">Marketplace</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="container">
    <section class="card tracker-section">
      <h3>Track Your Daily Water Usage</h3>
      <form id="waterForm">
        <label for="date">📅 Date:</label>
        <input type="date" id="date" required>

        <label for="state">🏞️ Select State:</label>
        <select id="state" required>
          <option value="">Select a State</option>
        </select>

        <label for="crop">🌾 Select Crop:</label>
        <select id="crop" required>
          <option value="">Select a Crop</option>
        </select>

        <label for="amount">💧 Water Used (litres):</label>
        <input type="number" id="amount" placeholder="Enter litres used" required>

        <button type="submit">Add Entry</button>
      </form>
    </section>

    <section class="card summary-section">
      <div class="summary-header">
        <h3>Usage Summary</h3>
        <div style="display: flex; gap: 10px;">
          <button id="exportBtn" class="export-btn">
            <i class="fas fa-file-pdf"></i> Export to PDF
          </button>
          <button id="viewHistoryBtn" class="export-btn" style="background: #2196F3;">
            <i class="fas fa-history"></i> View Records
          </button>
        </div>
      </div>
      <p><strong>Total Water Used:</strong> <span id="totalUsage">0</span> litres</p>
      <p><strong>Average Daily Usage:</strong> <span id="avgUsage">0</span> litres</p>
    </section>

    <section class="card advisor-section">
      <h3>Smart Water Advisor</h3>
      <p id="advisorMessage">Select a state, crop and enter your usage to get advice.</p>
    </section>

    <section class="card chart-section">
      <h3>Water Usage Trend</h3>
      <canvas id="waterChart" width="400" height="200"></canvas>
    </section>
  </main>

  <!-- History Modal -->
  <div id="historyModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; overflow-y: auto;">
    <div style="background: white; margin: 50px auto; max-width: 900px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #2e7d32; margin: 0;">📊 Water Usage History</h2>
        <button onclick="closeHistoryModal()" style="background: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px;">
          <i class="fas fa-times"></i> Close
        </button>
      </div>
      <div id="historyContent" style="max-height: 500px; overflow-y: auto;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="web.js"></script>
  <script>
    const form = document.getElementById('waterForm');
    const totalUsage = document.getElementById('totalUsage');
    const avgUsage = document.getElementById('avgUsage');
    const advisorMessage = document.getElementById('advisorMessage');
    const ctx = document.getElementById('waterChart').getContext('2d');

    // Crop water requirements (litres/day per acre approx)
    const cropRequirements = {
      rice: 5000,
      wheat: 2500,
      sugarcane: 7000,
      groundnut: 3000,
      cotton: 4000,
      maize: 3500,
      banana: 6000,
      soybean: 3200,
      jute: 4500,
      potato: 4000,
      millet: 3000,
      tea: 5000,
      apple: 4000,
      coconut: 3500,
      rubber: 5000,
      bajra: 3000,
      mustard: 3200
    };

    let usageData = [];
    let labels = [];
    let currentState = '';
    let currentCrop = '';

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Daily Water Usage (litres)',
          data: usageData,
          borderColor: 'blue',
          backgroundColor: 'lightblue',
          fill: true
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    // Load history from localStorage
    let waterHistory = JSON.parse(localStorage.getItem('waterUsageHistory')) || [];

    // Export functionality
    document.getElementById('exportBtn').addEventListener('click', exportToPDF);
    document.getElementById('viewHistoryBtn').addEventListener('click', showHistoryModal);

    function getRecommendation(crop, amount, state) {
      const recommended = cropRequirements[crop] || 5000;
      
      if (amount < recommended * 0.8) {
        return `⚠️ You used less water than needed for ${crop} in ${state}. Consider adding more irrigation.`;
      } else if (amount > recommended * 1.2) {
        return `🚨 You used too much water for ${crop} in ${state}. Try drip irrigation or scheduled watering to save water.`;
      } else {
        return `✅ Your water usage for ${crop} in ${state} is optimal.`;
      }
    }

    function exportToPDF() {
      if (usageData.length === 0) {
        alert('No data available to export');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Header
      doc.setFillColor(46, 125, 50);
      doc.rect(0, 0, 210, 40, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(24);
      doc.text('Farm2Future', 105, 20, { align: 'center' });
      doc.setFontSize(14);
      doc.text('Water Usage Report', 105, 30, { align: 'center' });
      
      // Get current data - use stored values
      const stateName = currentState || 'Not Selected';
      const cropName = currentCrop || 'Not Selected';
      
      // Report Info
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(11);
      doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 50);
      doc.text(`State: ${stateName}`, 20, 56);
      doc.text(`Crop: ${cropName}`, 20, 62);
      
      // Summary
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.text('Summary:', 20, 75);
      doc.setFont(undefined, 'normal');
      doc.setFontSize(10);
      doc.text(`Total Water Used: ${totalUsage.textContent} litres`, 20, 82);
      doc.text(`Average Daily Usage: ${avgUsage.textContent} litres`, 20, 88);
      
      // Table Header
      doc.setFillColor(46, 125, 50);
      doc.rect(20, 95, 170, 10, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.setFont(undefined, 'bold');
      doc.text('Date', 25, 101);
      doc.text('Water Used (L)', 65, 101);
      doc.text('Recommendation', 105, 101);
      
      // Table Data
      doc.setTextColor(0, 0, 0);
      doc.setFont(undefined, 'normal');
      doc.setFontSize(9);
      let yPos = 110;
      
      const labels = chart.data.labels;
      const data = chart.data.datasets[0].data;
      
      labels.forEach((label, index) => {
        if (yPos > 260) {
          doc.addPage();
          
          // Repeat header on new page
          doc.setFillColor(46, 125, 50);
          doc.rect(20, 10, 170, 10, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(10);
          doc.setFont(undefined, 'bold');
          doc.text('Date', 25, 16);
          doc.text('Water Used (L)', 65, 16);
          doc.text('Recommendation', 105, 16);
          
          doc.setTextColor(0, 0, 0);
          doc.setFont(undefined, 'normal');
          doc.setFontSize(9);
          yPos = 25;
        }
        
        const amount = data[index];
        const recommendation = getRecommendation(cropName.toLowerCase(), amount, stateName);
        
        // Remove emoji and format text properly
        const cleanRec = recommendation.replace(/[⚠️🚨✅]/g, '').trim();
        
        // Split long recommendations into multiple lines with proper width
        const maxWidth = 85;
        const recLines = doc.splitTextToSize(cleanRec, maxWidth);
        
        // Draw date and amount
        doc.text(label, 25, yPos);
        doc.text(amount.toString(), 70, yPos);
        
        // Draw recommendation (first line)
        doc.text(recLines[0], 105, yPos);
        
        // If there are more lines, add them below
        if (recLines.length > 1) {
          for (let i = 1; i < Math.min(recLines.length, 2); i++) {
            yPos += 5;
            doc.text(recLines[i], 105, yPos);
          }
        }
        
        yPos += 10;
      });
      
      // Footer
      doc.setFontSize(9);
      doc.setTextColor(100, 100, 100);
      doc.text('Farm2Future - Smart Water Management', 105, 285, { align: 'center' });
      
      // Save PDF
      doc.save(`Water_Usage_Report_${new Date().toISOString().split('T')[0]}.pdf`);
      
      // Save to history
      saveToHistory(stateName, cropName, labels, data);
    }

    function saveToHistory(state, crop, dates, amounts) {
      const record = {
        id: Date.now(),
        timestamp: new Date().toISOString(),
        state: state,
        crop: crop,
        entries: dates.map((date, index) => ({
          date: date,
          amount: amounts[index],
          recommendation: getRecommendation(crop.toLowerCase(), amounts[index], state)
        })),
        totalUsage: amounts.reduce((sum, val) => sum + val, 0),
        avgUsage: (amounts.reduce((sum, val) => sum + val, 0) / amounts.length).toFixed(1)
      };
      
      waterHistory.unshift(record);
      
      // Keep only last 50 records
      if (waterHistory.length > 50) {
        waterHistory = waterHistory.slice(0, 50);
      }
      
      localStorage.setItem('waterUsageHistory', JSON.stringify(waterHistory));
    }

    function showHistoryModal() {
      const modal = document.getElementById('historyModal');
      const content = document.getElementById('historyContent');
      
      if (waterHistory.length === 0) {
        content.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No history records found. Export a report to create your first record.</p>';
      } else {
        let html = '<div style="display: grid; gap: 15px;">';
        
        waterHistory.forEach((record, index) => {
          html += `
            <div style="border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px; background: #f9f9f9;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>
                  <h3 style="margin: 0; color: #2e7d32;">📊 Record #${waterHistory.length - index}</h3>
                  <p style="margin: 5px 0 0 0; color: #666; font-size: 13px;">
                    ${new Date(record.timestamp).toLocaleString()}
                  </p>
                </div>
                <button onclick="deleteRecord(${record.id})" style="background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
              
              <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
                <div style="background: white; padding: 10px; border-radius: 8px;">
                  <strong>🏞️ State:</strong> ${record.state}
                </div>
                <div style="background: white; padding: 10px; border-radius: 8px;">
                  <strong>🌾 Crop:</strong> ${record.crop}
                </div>
                <div style="background: white; padding: 10px; border-radius: 8px;">
                  <strong>💧 Total Usage:</strong> ${record.totalUsage} L
                </div>
                <div style="background: white; padding: 10px; border-radius: 8px;">
                  <strong>📊 Avg Usage:</strong> ${record.avgUsage} L
                </div>
              </div>
              
              <details style="margin-top: 10px;">
                <summary style="cursor: pointer; padding: 10px; background: white; border-radius: 8px; font-weight: 600;">
                  View ${record.entries.length} Entries
                </summary>
                <div style="margin-top: 10px; max-height: 200px; overflow-y: auto;">
                  ${record.entries.map(entry => `
                    <div style="background: white; padding: 10px; margin: 5px 0; border-radius: 6px; border-left: 4px solid #2e7d32;">
                      <strong>📅 ${entry.date}:</strong> ${entry.amount} litres<br>
                      <small style="color: #666;">${entry.recommendation}</small>
                    </div>
                  `).join('')}
                </div>
              </details>
            </div>
          `;
        });
        
        html += '</div>';
        content.innerHTML = html;
      }
      
      modal.style.display = 'block';
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    function deleteRecord(id) {
      if (confirm('Are you sure you want to delete this record?')) {
        waterHistory = waterHistory.filter(record => record.id !== id);
        localStorage.setItem('waterUsageHistory', JSON.stringify(waterHistory));
        showHistoryModal();
      }
    }

    // Close modal when clicking outside
    document.getElementById('historyModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeHistoryModal();
      }
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const date = document.getElementById('date').value;
      const amount = parseInt(document.getElementById('amount').value);
      const crop = document.getElementById('crop').value.toLowerCase();
      const state = document.getElementById('state').value;
      
      // Store the selected state and crop names (text, not values)
      const stateSelect = document.getElementById('state');
      const cropSelect = document.getElementById('crop');
      currentState = stateSelect.options[stateSelect.selectedIndex]?.text || state;
      currentCrop = cropSelect.options[cropSelect.selectedIndex]?.text || crop;

      // Add to chart data
      usageData.push(amount);
      labels.push(date);
      chart.update();

      // Update summary
      const total = usageData.reduce((sum, val) => sum + val, 0);
      totalUsage.textContent = total;
      avgUsage.textContent = (total / usageData.length).toFixed(1);

      // Advisor logic
      const recommended = cropRequirements[crop] || 5000;
      let advice = "";

      if (amount < recommended * 0.8) {
        advice = `⚠️ You used less water than needed for ${crop} in ${state}. Consider adding more irrigation.`;
      } else if (amount > recommended * 1.2) {
        advice = `🚨 You used too much water for ${crop} in ${state}. Try drip irrigation or scheduled watering to save water.`;
      } else {
        advice = `✅ Perfect! Your water usage for ${crop} in ${state} is optimal.`;
      }

      advisorMessage.textContent = advice;
      form.reset();
    });
  </script>
  
  <!-- Voice Guide Feature for Water Tracker -->
  <script src="voice-guide-water.js"></script>
</body>
</html>
