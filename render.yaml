services:
  - type: web
    name: farm2future
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: farm2future-db
          property: connectionString

databases:
  - name: farm2future-db
    plan: free
