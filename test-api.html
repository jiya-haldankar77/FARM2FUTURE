<!DOCTYPE html>
<html>
<head>
    <title>Farm2Future API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Farm2Future API Connection Test</h1>
    
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="testLogin()">Test Login Endpoint</button>
    
    <div id="results"></div>

    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:10000/api' 
            : `${window.location.protocol}//${window.location.host}/api`;
        
        console.log('API URL:', API_URL);
        
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            
            try {
                const response = await fetch(`${API_URL}/test`);
                const data = await response.json();
                
                resultsDiv.innerHTML += `
                    <div class="test-result success">
                        ✅ API Test Success: ${data.message} (${data.timestamp})
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="test-result error">
                        ❌ API Test Failed: ${error.message}
                    </div>
                `;
            }
        }
        
        async function testLogin() {
            const resultsDiv = document.getElementById('results');
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email: 'test@test.com', password: 'test' })
                });
                
                const data = await response.json();
                
                resultsDiv.innerHTML += `
                    <div class="test-result ${response.ok ? 'success' : 'error'}">
                        ${response.ok ? '✅' : '❌'} Login Endpoint Response: ${JSON.stringify(data)}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="test-result error">
                        ❌ Login Test Failed: ${error.message}
                    </div>
                `;
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            testAPI();
        };
    </script>
</body>
</html>
