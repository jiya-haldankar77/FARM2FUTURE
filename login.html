<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm2Future - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-bg">
    <video autoplay muted loop id="bg-video">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div class="overlay"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-container">
        <div class="logo">
          <i class="fas fa-leaf"></i>
        </div>
        <h1>Farm2Future</h1>
        <p class="tagline">Cultivating the future of farming</p>
      </div>
      
      <form class="login-form" onsubmit="login(); return false;">
        <div class="form-group">
          <div class="input-with-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Username" required>
          </div>
        </div>
        
        <div class="form-group">
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
          </div>
        </div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        
        <button type="submit" class="login-btn">
          <span>Sign In</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
      
      <div class="signup-link">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
      
      <div id="logout-msg" class="logout-message"></div>
    </div>
  </div>

  <script src="login-handler.js"></script>
</body>
</html>
